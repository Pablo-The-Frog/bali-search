<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CDP TSI1 – Archives</title>
  <style>
    :root {
      --bg: #0f1115;
      --sidebar: #161a22;
      --border: #2a2f3a;
      --text: #e6e9ef;
      --text-dim: #9aa3b5;
      --accent: #6ea8fe;
      --hover: #1e2430;
      --file: #c5d0e0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 320px;
      min-width: 280px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
      z-index: 100;
    }

    .sidebar-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .sidebar-header .title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-header span.badge {
      background: var(--accent);
      color: #0b0e14;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
    }

    #close-sidebar {
      display: none;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 22px;
      cursor: pointer;
    }

    #tree {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px 40px;
      font-size: 13.5px;
    }

    .folder, .file {
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 7px;
      user-select: none;
      line-height: 1.35;
    }

    .folder:hover, .file:hover { background: var(--hover); }

    .folder-icon::before { content: "📁"; font-size: 14px; }
    .folder.open > .folder-icon::before { content: "📂"; }
    .file-icon::before { content: "📄"; font-size: 13px; }

    .children {
      margin-left: 14px;
      display: none;
      border-left: 1px solid #2a303c;
      padding-left: 6px;
    }
    .folder.open > .children { display: block; }

    /* Main */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    #topbar {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    #menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      font-size: 22px;
      cursor: pointer;
    }

    #breadcrumb {
      font-size: 14px;
      color: var(--text-dim);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    #breadcrumb span { cursor: pointer; }
    #breadcrumb span:hover { color: var(--accent); }

    #content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 60px;
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      margin-bottom: 14px;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--sidebar);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .card:hover {
      border-color: var(--accent);
      background: #1a2030;
      transform: translateY(-1px);
    }

    .card-icon { font-size: 22px; }
    .card-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

    .empty {
      color: var(--text-dim);
      text-align: center;
      margin-top: 60px;
      font-size: 15px;
    }

    /* Overlay mobile */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 90;
    }

    /* ========== MOBILE ========== */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        transform: translateX(-100%);
      }
      #sidebar.open {
        transform: translateX(0);
      }
      #menu-btn, #close-sidebar {
        display: block;
      }
      #overlay.active {
        display: block;
      }
      .grid {
        grid-template-columns: 1fr;
      }
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #2e3544; border-radius: 4px; }
  </style>
</head>
<body>

  <div id="overlay"></div>

  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="title">
        CDP TSI1
        <span class="badge">Archives</span>
      </div>
      <button id="close-sidebar">✕</button>
    </div>
    <div id="tree">Chargement...</div>
  </aside>

  <main id="main">
    <div id="topbar">
      <button id="menu-btn">☰</button>
      <div id="breadcrumb">...</div>
    </div>
    <div id="content"></div>
  </main>

<script>
  let treeData = null;
  const HIDDEN = ["index.html", "tree.json", "generate_tree.py", "start.sh", "index_static.html"];

  // Mobile menu
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");
  document.getElementById("menu-btn").onclick = () => {
    sidebar.classList.add("open");
    overlay.classList.add("active");
  };
  document.getElementById("close-sidebar").onclick = closeMenu;
  overlay.onclick = closeMenu;
  function closeMenu() {
    sidebar.classList.remove("open");
    overlay.classList.remove("active");
  }

  async function loadTree() {
    try {
      const res = await fetch("tree.json");
      treeData = await res.json();
      renderSidebar();
      openPath("Général");
    } catch (e) {
      document.getElementById("tree").innerHTML = `
        <div style="padding:20px;color:#f87171;font-size:13px;line-height:1.5">
          <b>Erreur</b><br>
          Impossible de charger tree.json
        </div>`;
    }
  }

  function renderSidebar() {
    const container = document.getElementById("tree");
    container.innerHTML = "";
    treeData.children.forEach(child => {
      if (HIDDEN.includes(child.name)) return;
      container.appendChild(createNode(child));
    });
  }

  function createNode(node) {
    const div = document.createElement("div");

    if (node.type === "directory") {
      div.className = "folder";
      div.innerHTML = `<span class="folder-icon"></span><span>${node.name}</span>`;

      const childrenDiv = document.createElement("div");
      childrenDiv.className = "children";
      (node.children || []).forEach(c => {
        if (HIDDEN.includes(c.name)) return;
        childrenDiv.appendChild(createNode(c));
      });
      div.appendChild(childrenDiv);

      div.addEventListener("click", (e) => {
        e.stopPropagation();
        div.classList.toggle("open");
        openPath(node.path);
        if (window.innerWidth <= 768) closeMenu();
      });

      if (node.name === "Général") div.classList.add("open");
    } else {
      div.className = "file";
      div.innerHTML = `<span class="file-icon"></span><span style="color:var(--file)">${node.name}</span>`;
      div.addEventListener("click", (e) => {
        e.stopPropagation();
        window.open(node.path, "_blank");
      });
    }
    return div;
  }

  function findNode(node, path) {
    if (node.path === path || node.name === path) return node;
    if (node.children) {
      for (const child of node.children) {
        const found = findNode(child, path);
        if (found) return found;
      }
    }
    return null;
  }

  function openPath(path) {
    const node = findNode(treeData, path) || treeData.children.find(c => c.name === "Général");

    const parts = node.path === "." ? ["Racine"] : node.path.split("/");
    document.getElementById("breadcrumb").innerHTML = parts.map((p, i) => {
      const full = parts.slice(0, i+1).join("/");
      return `<span onclick="openPath('${full === "Racine" ? "." : full}')">${p}</span>${i < parts.length-1 ? " /" : ""}`;
    }).join(" ");

    const content = document.getElementById("content");
    if (!node?.children?.length) {
      content.innerHTML = `<div class="empty">Dossier vide</div>`;
      return;
    }

    const folders = node.children.filter(c => c.type === "directory" && !HIDDEN.includes(c.name));
    const files   = node.children.filter(c => c.type === "file" && !HIDDEN.includes(c.name));

    let html = "";

    if (folders.length) {
      html += `<div class="section-title">Dossiers</div><div class="grid">`;
      folders.forEach(f => {
        html += `
          <div class="card" onclick="openPath('${f.path}')">
            <div class="card-icon">📁</div>
            <div>
              <div class="card-name">${f.name}</div>
              <div class="card-meta">${f.children?.length || 0} éléments</div>
            </div>
          </div>`;
      });
      html += `</div>`;
    }

    if (files.length) {
      html += `<div class="section-title">Fichiers</div><div class="grid">`;
      files.forEach(f => {
        const ext = f.name.split(".").pop().toLowerCase();
        html += `
          <div class="card" onclick="window.open('${f.path}', '_blank')">
            <div class="card-icon">${ext === "pdf" ? "📕" : "📄"}</div>
            <div>
              <div class="card-name">${f.name}</div>
              <div class="card-meta">${ext.toUpperCase()}</div>
            </div>
          </div>`;
      });
      html += `</div>`;
    }

    content.innerHTML = html;
  }

  loadTree();
</script>
</body>
</html>
