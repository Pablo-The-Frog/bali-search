<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CDP TSI1 – Archives</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #161a22;
      --border: #2a2f3a;
      --text: #e6e9ef;
      --text-dim: #9aa3b5;
      --accent: #6ea8fe;
      --hover: #1e2430;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    #back {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: none;
    }
    #back:hover { border-color: var(--accent); }

    #title {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #content {
      padding: 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.15s;
    }
    .item:hover {
      border-color: var(--accent);
      background: var(--hover);
    }

    .icon { font-size: 20px; width: 28px; text-align: center; }
    .name {
      flex: 1;
      font-size: 14.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta {
      font-size: 12px;
      color: var(--text-dim);
    }

    .empty {
      text-align: center;
      color: var(--text-dim);
      margin-top: 60px;
      font-size: 15px;
    }

    .section {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-dim);
      margin: 20px 0 10px 4px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <button id="back" onclick="goBack()">← Retour</button>
    <div id="title">Chargement...</div>
  </header>

  <div id="content"></div>

<script>
  let treeData = null;
  let currentPath = "";
  let historyStack = [];

  const HIDDEN = ["index.html", "tree.json", "generate_tree.py", "start.sh", "index_static.html"];

  async function loadTree() {
    try {
      const res = await fetch("tree.json");
      treeData = await res.json();
      openPath(".");          // ← on arrive à la racine
    } catch (e) {
      document.getElementById("content").innerHTML = `<div class="empty">Erreur de chargement de tree.json</div>`;
    }
  }

  function findNode(node, path) {
    if (node.path === path || node.name === path) return node;
    if (node.children) {
      for (const child of node.children) {
        const found = findNode(child, path);
        if (found) return found;
      }
    }
    return null;
  }

  function openPath(path, pushHistory = true) {
    const node = findNode(treeData, path);
    if (!node) return;

    if (pushHistory && currentPath && currentPath !== path) {
      historyStack.push(currentPath);
    }
    currentPath = path;

    document.getElementById("title").textContent = node.name === "CDP-TSI1" ? "CDP TSI1" : node.name;
    document.getElementById("back").style.display = historyStack.length > 0 ? "block" : "none";

    const content = document.getElementById("content");

    if (!node.children || node.children.length === 0) {
      content.innerHTML = `<div class="empty">Dossier vide</div>`;
      return;
    }

    const folders = node.children.filter(c => c.type === "directory" && !HIDDEN.includes(c.name));
    const files   = node.children.filter(c => c.type === "file" && !HIDDEN.includes(c.name));

    let html = "";

    if (folders.length) {
      html += `<div class="section">Dossiers</div>`;
      folders.forEach(f => {
        const count = f.children ? f.children.length : 0;
        html += `
          <div class="item" onclick="openPath('${f.path}')">
            <div class="icon">📁</div>
            <div class="name">${f.name}</div>
            <div class="meta">${count}</div>
          </div>`;
      });
    }

    if (files.length) {
      html += `<div class="section">Fichiers</div>`;
      files.forEach(f => {
        const ext = f.name.split(".").pop().toLowerCase();
        html += `
          <div class="item" onclick="window.open('${f.path}', '_blank')">
            <div class="icon">${ext === "pdf" ? "📕" : "📄"}</div>
            <div class="name">${f.name}</div>
            <div class="meta">${ext.toUpperCase()}</div>
          </div>`;
      });
    }

    content.innerHTML = html;
  }

  function goBack() {
    if (historyStack.length === 0) return;
    const prev = historyStack.pop();
    openPath(prev, false);
  }

  loadTree();
</script>
</body>
</html>
